<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Civic Issue</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Report a Civic Issue</h1>
        <p>Upload a clear photo of the issue (e.g., pothole, broken streetlight) for AI verification.</p>
        
        <div class="upload-box">
            <input type="file" id="imageInput" accept="image/*">
            <button onclick="submitReport()" id="submitBtn">Verify & Submit</button>
        </div>

        <div id="loading" class="hidden">Analyzing image with AI... Please wait.</div>
        
        <div id="results" class="hidden">
            <h2>AI Verification Results</h2>
            <p><strong>Status:</strong> <span id="resStatus"></span></p>
            <p><strong>Detected Issue:</strong> <span id="resIssue"></span></p>
            <p><strong>AI Confidence:</strong> <span id="resAi"></span></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
