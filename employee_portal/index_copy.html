<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Verification Dashboard</title>
    <link rel="stylesheet" href="style_copy.css">
</head>
<body>
    <div class="sidebar">
        <h2>Admin Dashboard</h2>
        <ul>
            <li class="nav-item active" onclick="filterView('pending')">Pending Reviews</li>
            <li class="nav-item" onclick="filterView('resolved')">Resolved Issues</li>
            <li class="nav-item" onclick="filterView('rejected')">Rejected Duplicates</li>
        </ul>
    </div>
    
    <div class="main-content">
        <h1>Manual Image Review Tool</h1>
        <p>Upload a flagged submission to retrieve its internal metadata, exact AI score, and duplicate hash.</p>
        
        <div class="admin-panel">
            <input type="file" id="adminImageInput" accept="image/*">
            <button onclick="runAdminCheck()">Run Diagnostic Verification</button>
        </div>

        <div id="adminResults" class="hidden">
            <h3>Detailed Diagnostic Report</h3>
            <pre id="jsonOutput"></pre>
            <button type="button" id="resolveBtn" onclick="markAsResolved()" style="background-color: #10b981; margin-top: 10px;">Mark Issue as Resolved</button>
        </div>
    </div>
    <script src="script_copy.js"></script>
</body>
</html>
